<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Аружан 🌸</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <h1>Аружан, ты — чудо! ✨</h1>
        
        <div class="tree-container">
            <div class="lantern lantern-1" onclick="showLove('Аружан, ты просто НЕПОВТОРИМАЯ! Такой, как ты, больше нет во всей Вселенной. 💖')">Неповторимая</div>
            <div class="lantern lantern-2" onclick="showLove('Ты — НЕОПИСУЕМАЯ красота! Твои глаза и улыбка сводят меня с ума. 😍')">Неописуемая</div>
            <div class="lantern lantern-3" onclick="showLove('Ты самая ЗАМЕЧАТЕЛЬНАЯ девушка! С тобой каждый день становится праздником. 🌹')">Замечательная</div>
            <div class="lantern lantern-4" onclick="showLove('Ты — ПРЕВОСХОДНАЯ во всём, за что бы ни взялась. Восхищаюсь тобой! 💫')">Превосходная</div>
            <div class="lantern lantern-5" onclick="showLove('Ты — ТОЛЬКО МОЯ и самая любимая на свете. Я счастлив, что встретил тебя! 🥰')">Только моя</div>
            <div class="lantern lantern-6" onclick="showLove('Аружан, твоя нежность и доброта — моё главное вдохновение. Люблю тебя бесконечно! 💕')">Любимая</div>
        </div>

        <div class="footer">Для моей единственной Аружан ❤️</div>
    </div>

    <div id="modal" class="modal hidden" onclick="closeModal()">
        <div class="modal-content">
            <p id="modal-text"></p>
            <span class="close-btn">(нажмите, чтобы закрыть)</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
